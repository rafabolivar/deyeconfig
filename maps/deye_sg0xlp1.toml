# Configuration register map: Deye single-phase low-voltage hybrid inverter
# (SUN-xK-SG0xLP1: SG03LP1, SG04LP1, SG05LP1...).
#
# Sources: Deye Modbus protocol V118 and the "deye_hybrid.yaml" definition from
# the ha-solarman project (https://github.com/davidrapan/ha-solarman).
# Tested with a SUN-6K-SG03LP1-EU.
#
# Parameter fields:
#   group     section shown by deye_read_config.py
#   id        identifier used in profiles (profiles/*.toml)
#   writable  whether profiles may change it (false = read-only, for safety)
#   min, max  range allowed when writing, in the parameter's units
#   reg       holding register number
#   name      human-readable name
#   type      num       value * scale, with unit
#             enum      value translated with the "options" table
#             switch    0 = No, non-zero = Yes
#             bit       Yes/No depending on bit "bit"
#             days      Time Of Use register: bit 0 enabled, bits 1-7 Monday..Sunday
#             datetime  inverter clock (3 registers)

[info]
model = "Deye SUN-xK-SG0xLP1 (single-phase LV hybrid)"
backup_range = [0, 340]

# Time Of Use: first register of each block (one register per slot).
# charge register: bit 0 = grid charging, bit 1 = generator charging,
# other bits are preserved when writing.
[tou]
slots = 6
time = 250
power = 256
voltage = 262
soc = 268
charge = 274
power_max = 6000
voltage_min = 44
voltage_max = 58


# ---------------------------------------------------------------- General

[[param]]
group = "General"
id = "inverter_clock"
writable = false
reg = 22
name = "Inverter clock"
type = "datetime"

[[param]]
group = "General"
id = "self_check_time"
writable = false
reg = 21
name = "Self-check time"
type = "num"
unit = "s"

