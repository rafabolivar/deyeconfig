# Connection settings for a Deye inverter through the Solarman data logger.
# Copy this file to config.toml and fill in your values:
#     cp config.example.toml config.toml
# config.toml is listed in .gitignore and is never committed.

[logger]
# IP address of the data logger (WiFi/LAN stick) on your local network.
# Recommended: reserve it with a DHCP reservation on your router.
ip = "192.168.1.100"

# Serial number of the LOGGER (sticker on the stick or Solarman app),
# not the inverter's. It is a number, without quotes.
serial = 0

# Modbus TCP port of the logger (usually 8899).
port = 8899

[modbus]
# Modbus slave ID of the inverter (usually 1).
slave_id = 1

# Connection timeout, in seconds.
timeout = 10

[inverter]
# Register map for the inverter model (maps/ folder).
# Default: Deye single-phase low-voltage hybrid (SG0xLP1).
map = "maps/deye_sg0xlp1.toml"

[storm]
# Storm mode service (deye_storm.py): pre-charges the battery from the grid when
# thunderstorms or very heavy rain are forecast (Open-Meteo forecast).

# Location for the weather forecast (decimal degrees) and its time zone.
latitude = 0.0
longitude = 0.0
timezone = "Europe/Madrid"

# Seconds between weather forecast checks.
forecast_interval = 900
# Seconds between grid / battery checks while in storm mode (outage detection).
grid_check_interval = 60

# Planning: at planning_time, look forecast_hours ahead. If a storm is forecast,
# charge from the grid up to target_soc, finishing at ready_by, or
# storm_margin_minutes before the storm if it comes earlier.
planning_time = "00:00"
forecast_hours = 24
ready_by = "07:30"
storm_margin_minutes = 30
target_soc = 80

# Battery level allowed while the grid is down in storm mode (%).
outage_soc = 15
# After an outage, recharge to target_soc as soon as the grid returns
# (false = wait for the next planning run).
recharge_after_outage = true

# Backup outside planning: if a storm is forecast within backup_hours and the
# SOC is below backup_trigger_soc, charge immediately.
backup_enabled = true
backup_hours = 4
backup_trigger_soc = 50

# What counts as a storm: weather codes (WMO 95, 96, 99 = thunderstorm) and
# heavy rain in mm/h with a minimum probability (%).
storm_codes = [95, 96, 99]
heavy_rain_mm = 10.0
min_probability = 50

# Restore the previous configuration this many hours after the last storm hour,
# and in any case after max_hours in storm mode (safety limit).
grace_hours = 1
max_hours = 36

# Used to estimate the charging time.
battery_nominal_voltage = 51.2
charge_efficiency = 0.9

# Safety limit of inverter writes per day.
max_writes_per_day = 20
