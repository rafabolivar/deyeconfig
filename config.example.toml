# Connection settings for a Deye inverter through the Solarman data logger.
# Copy this file to config.toml and fill in your values:
#     cp config.example.toml config.toml
# config.toml is listed in .gitignore and is never committed.

[logger]
# IP address of the data logger (WiFi/LAN stick) on your local network.
# Recommended: reserve it with a DHCP reservation on your router.
ip = "192.168.1.100"

# Serial number of the LOGGER (sticker on the stick or Solarman app),
# not the inverter's. It is a number, without quotes.
serial = 0

# Modbus TCP port of the logger (usually 8899).
port = 8899

[modbus]
# Modbus slave ID of the inverter (usually 1).
slave_id = 1

# Connection timeout, in seconds.
timeout = 10

[inverter]
# Register map for the inverter model (maps/ folder).
# Default: Deye single-phase low-voltage hybrid (SG0xLP1).
map = "maps/deye_sg0xlp1.toml"

[storm]
# Storm protection, part of the automatic mode (deye_optimizer.py). When a
# thunderstorm or very heavy rain is forecast (Open-Meteo), the battery is kept at
# or above reserve_soc around the storm, charging in the cheapest hours before it.

# Location for the forecasts (decimal degrees) and its time zone.
latitude = 0.0
longitude = 0.0
timezone = "Europe/Madrid"

# Set to false to disable storm protection (price optimization still runs).
enabled = true

# Seconds between grid checks (outage detection).
grid_check_interval = 60

# What counts as a storm: weather codes (WMO 95, 96, 99 = thunderstorm) and heavy
# rain in mm/h with a minimum probability (%).
storm_codes = [95, 96, 99]
heavy_rain_mm = 10.0
min_probability = 50

# Reserve: minimum battery level (%) from reserve_lead_hours before each storm hour
# until grace_hours after it.
reserve_soc = 80
reserve_lead_hours = 0.5
grace_hours = 1

# Cost (EUR per kWh and hour) of being below the reserve. High, so the plan always
# tries to reach it: in the cheapest hours if possible, in peak hours only if needed.
shortfall_penalty = 2.0

# Battery level allowed while the grid is down (%): the whole battery is available.
outage_soc = 15

[tariff]
# Fallback only: used when the real PVPC prices (REData) are not available.
# Representative price (EUR/kWh) of each period.
fallback_prices = { "off-peak" = 0.18, "mid" = 0.15, "peak" = 0.25 }
# Tariff periods.
periods = [
  ["00:00", "off-peak"],
  ["08:00", "mid"],
  ["10:00", "peak"],
  ["14:00", "mid"],
  ["18:00", "peak"],
  ["22:00", "mid"],
]
# Saturdays and Sundays are off-peak all day.
weekend_off_peak = true
# Holidays, off-peak all day: "MM-DD" (every year) or "YYYY-MM-DD".
# Default: Spanish national holidays with a fixed date (regional and local
# holidays do not count in 2.0TD).
holidays = ["01-01", "01-06", "05-01", "08-15", "10-12", "11-01", "12-06", "12-08", "12-25"]

[optimizer]
# Automatic mode (deye_optimizer.py): plans grid charging from the real hourly
# PVPC prices (REData), the solar forecast and the expected consumption, with
# the storm protection of [storm]. Location and time zone are taken from [storm].

# Seconds between plans.
interval = 900

# Solar installation: peak power (kWp), measured performance factor (actual
# production / theoretical from the irradiance on the panels), tilt (degrees)
# and azimuth (0 = south, -90 = east, 90 = west).
pv_kwp = 3.535
pv_performance = 0.54
panel_tilt = 35
panel_azimuth = -45

# Battery levels (%) and efficiencies.
min_soc = 15
max_soc = 100
battery_nominal_voltage = 51.2
charge_efficiency = 0.95
discharge_efficiency = 0.95

# Battery wear cost per kWh discharged (EUR) and price paid for exported energy (EUR/kWh).
cycle_cost = 0.01
export_price = 0.04

# Limits: grid draw (W, inverter peak shaving) and currents (A).
grid_power_limit = 4000
max_grid_charge_current = 65
max_charge_current = 90
max_discharge_current = 95

# Hours ahead to plan.
horizon_hours = 36

# Slot SOC values are rounded up to this step (%), so small changes do not
# rewrite the inverter, and safety limit of plan writes per day.
soc_step = 5
max_writes_per_day = 24

# Expected consumption (kW) for each hour of the day, 00 to 23.
load_profile = [0.36, 0.36, 0.36, 0.36, 0.36, 0.36, 0.36, 0.36,
                0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
                0.9, 0.9, 0.9, 0.9, 0.6, 0.6]
