# Connection settings for a Deye inverter through the Solarman data logger.
# Copy this file to config.toml and fill in your values:
#     cp config.example.toml config.toml
# config.toml is listed in .gitignore and is never committed.

[logger]
# IP address of the data logger (WiFi/LAN stick) on your local network.
# Recommended: reserve it with a DHCP reservation on your router.
ip = "192.168.1.100"

# Serial number of the LOGGER (sticker on the stick or Solarman app),
# not the inverter's. It is a number, without quotes.
serial = 0

# Modbus TCP port of the logger (usually 8899).
port = 8899

[modbus]
# Modbus slave ID of the inverter (usually 1).
slave_id = 1

# Connection timeout, in seconds.
timeout = 10

[inverter]
# Register map for the inverter model (maps/ folder).
# Default: Deye single-phase low-voltage hybrid (SG0xLP1).
map = "maps/deye_sg0xlp1.toml"

[storm]
# Storm mode service (deye_storm.py): when thunderstorms or very heavy rain are
# forecast (Open-Meteo), keeps the battery charged for a possible power outage,
# charging from the grid in the cheapest tariff periods (see [tariff]).

# Location for the weather forecast (decimal degrees) and its time zone.
latitude = 0.0
longitude = 0.0
timezone = "Europe/Madrid"

# Seconds between weather forecast checks (also checked at every tariff period change).
forecast_interval = 900
# Seconds between grid / battery checks while in storm mode (outage detection).
grid_check_interval = 60

# Hours ahead to look for storms. In an off-peak period, a storm within this
# window starts storm mode.
forecast_hours = 24

# Battery levels in storm mode (%):
#   charge_soc  grid charge up to this level in off-peak periods
#   hold_soc    minimum level kept until the storm has passed; mid periods only
#               charge up to here, peak periods never charge
#   outage_soc  level allowed while the grid is down
charge_soc = 100
hold_soc = 80
outage_soc = 15

# Backup, mid periods: if a storm is forecast, the SOC is below backup_trigger_soc
# and there is no other cheap period (off-peak or mid) before the storm,
# start storm mode now.
backup_enabled = true
backup_trigger_soc = 50

# Emergency, peak periods: if a storm is happening or due within emergency_hours
# and the SOC is below emergency_soc, charge up to emergency_soc.
emergency_soc = 50
emergency_hours = 2

# Maximum power drawn from the grid in storm mode (W), using the inverter's grid
# peak shaving, to stay below the contracted power. 0 = do not change it.
grid_power_limit = 4000

# Grid charge current in storm mode (A), to charge quickly even if your daily
# profile uses a lower current. Restored when storm mode ends. 0 = do not change it.
charge_current = 40

# What counts as a storm: weather codes (WMO 95, 96, 99 = thunderstorm) and
# heavy rain in mm/h with a minimum probability (%).
storm_codes = [95, 96, 99]
heavy_rain_mm = 10.0
min_probability = 50

# Restore the previous configuration this many hours after the last storm hour,
# and in any case after max_hours in storm mode (safety limit).
grace_hours = 1
max_hours = 36

# Safety limit of inverter writes per day.
max_writes_per_day = 20

[tariff]
# Electricity tariff periods, used by storm mode to charge in the cheapest hours.
# Default: Spanish 2.0TD (valle = off-peak, llano = mid, punta = peak).
# Weekday periods: ["HH:MM" start, "off-peak" | "mid" | "peak"], first at 00:00,
# at most 6 (one per Time Of Use slot).
periods = [
  ["00:00", "off-peak"],
  ["08:00", "mid"],
  ["10:00", "peak"],
  ["14:00", "mid"],
  ["18:00", "peak"],
  ["22:00", "mid"],
]
# Saturdays and Sundays are off-peak all day.
weekend_off_peak = true
# Holidays, off-peak all day: "MM-DD" (every year) or "YYYY-MM-DD".
# Default: Spanish national holidays with a fixed date (regional and local
# holidays do not count in 2.0TD).
holidays = ["01-01", "01-06", "05-01", "08-15", "10-12", "11-01", "12-06", "12-08", "12-25"]
