# Mapa de registros de configuración: Deye híbrido monofásico de baja tensión
# (SUN-xK-SG0xLP1: SG03LP1, SG04LP1, SG05LP1...).
#
# Fuentes: protocolo Modbus Deye V118 y definición "deye_hybrid.yaml" del proyecto
# ha-solarman (https://github.com/davidrapan/ha-solarman). Verificado con un
# SUN-6K-SG03LP1-EU.
#
# Tipos:
#   num     valor * escala, con unidad
#   enum    valor traducido con la tabla "opciones"
#   switch  0 = No, distinto de 0 = Sí
#   bit     Sí/No según el bit indicado en "bit"
#   dias    registro Time Of Use: bit0 activo, bits 1-7 lunes..domingo
#   fecha   reloj del inversor (3 registros)

[info]
modelo = "Deye SUN-xK-SG0xLP1 (híbrido monofásico BT)"
rango_backup = [0, 340]

[tou]
franjas = 6
hora = 250
potencia = 256
tension = 262
soc = 268
carga = 274
opciones_carga = { "0" = "No", "1" = "Red", "2" = "Generador", "3" = "Red + Gen" }

# ---------------------------------------------------------------- General
[[param]]
grupo = "General"
reg = 22
nombre = "Reloj del inversor"
tipo = "fecha"

[[param]]
grupo = "General"
reg = 21
nombre = "Tiempo de autotest"
tipo = "num"
unidad = "s"

