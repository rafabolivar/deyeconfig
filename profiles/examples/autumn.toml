# EXAMPLE profile: autumn, sunny days.
# Charges the battery from the grid in the off-peak period (00:00-08:00) up to 60 %,
# so there is battery to start the day, and leaves room for the solar surplus.
# In the off-peak period the battery does not go below 60 %, so the house uses
# cheap grid energy at night. The rest of the day the battery can be used down
# to 15 %. Adjust the values to your installation.
#
# Only the parameters listed here are changed; everything else is left untouched.
# Available ids: python deye_read_config.py --raw
#
# Slots aligned with the Spanish 2.0TD tariff periods (weekdays):
#   00-08 off-peak | 08-10 mid | 10-14 peak | 14-18 mid | 18-22 peak | 22-24 mid

description = "Autumn (sunny days): off-peak grid charge up to 60 %"

[parameters]
grid_charge = true
grid_charge_current = 25            # A, gentle charge: ~3.5-4 h from 15 % to 60 %
max_charge_current = 90             # A, below the BMS limit (100 A, 3 s delay)
max_discharge_current = 95          # A, below the BMS limit (100 A, 30 s delay): no BMS cut-off during outages
time_of_use = "MTWTFSS"
grid_peak_shaving = true            # limit grid draw below the contracted power
grid_peak_shaving_power = 4000      # W

[[tou]]
slot = 1
time = "00:00"
power = 6000
soc = 60
grid_charge = true

[[tou]]
slot = 2
time = "08:00"
power = 6000
soc = 15
grid_charge = false

[[tou]]
slot = 3
time = "10:00"
power = 6000
soc = 15
grid_charge = false

[[tou]]
slot = 4
time = "14:00"
power = 6000
soc = 15
grid_charge = false

[[tou]]
slot = 5
time = "18:00"
power = 6000
soc = 15
grid_charge = false

[[tou]]
slot = 6
time = "22:00"
power = 6000
soc = 15
grid_charge = false
