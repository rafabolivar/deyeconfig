# EXAMPLE profile: winter / bad weather days.
# Charges the battery from the grid during off-peak hours (00:00-08:00) up to 80 %
# and keeps it for peak hours. Adjust the values to your installation.
#
# Only the parameters listed here are changed; everything else is left untouched.
# Available ids: python deye_read_config.py --raw
#
# Slots aligned with the Spanish 2.0TD tariff periods (weekdays):
#   00-08 off-peak | 08-10 mid | 10-14 peak | 14-18 mid | 18-22 peak | 22-24 mid

description = "Winter: grid charging during off-peak hours up to 80 %"

[parameters]
grid_charge = true
grid_charge_current = 40
time_of_use = true

[[tou]]
slot = 1
time = "00:00"
power = 6000
soc = 80
grid_charge = true

[[tou]]
slot = 2
time = "08:00"
power = 6000
soc = 20
grid_charge = false

[[tou]]
slot = 3
time = "10:00"
power = 6000
soc = 20
grid_charge = false

[[tou]]
slot = 4
time = "14:00"
power = 6000
soc = 20
grid_charge = false

[[tou]]
slot = 5
time = "18:00"
power = 6000
soc = 20
grid_charge = false

[[tou]]
slot = 6
time = "22:00"
power = 6000
soc = 20
grid_charge = false
