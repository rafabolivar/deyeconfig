# Perfil de EJEMPLO: invierno / días de mal tiempo.
# Carga la batería desde la red en horas valle (00:00-08:00) hasta el 80 %
# y la reserva para las horas punta. Ajusta los valores a tu instalación.
#
# Solo se modifican los parámetros que aparecen aquí; el resto no se toca.
# Ids disponibles: python deye_leer_config.py --raw
#
# Franjas alineadas con los periodos de la tarifa 2.0TD (días laborables):
#   00-08 valle | 08-10 llano | 10-14 punta | 14-18 llano | 18-22 punta | 22-24 llano

descripcion = "Invierno: carga desde red en valle hasta el 80 %"

[parametros]
carga_red = true
corriente_carga_red = 40
time_of_use = true

[[tou]]
franja = 1
hora = "00:00"
potencia = 6000
soc = 80
carga_red = true

[[tou]]
franja = 2
hora = "08:00"
potencia = 6000
soc = 20
carga_red = false

[[tou]]
franja = 3
hora = "10:00"
potencia = 6000
soc = 20
carga_red = false

[[tou]]
